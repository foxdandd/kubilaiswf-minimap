; Elden Ring minimap settings. Restart the game after changing them.

; Draw the path you walked on the minimap (true / false).
trail = true

; Turn the map with the camera. false keeps north up.
rotate = true

; Show the N / E / S / W letters.
compass = true

; Show your co-op partners, Seamless Co-op included.
coop_players = true

; Hide the minimap while a boss health bar is on screen.
hide_in_boss_fights = false

; Hide the minimap in catacombs, caves and tunnels, which have no map of their own.
hide_in_caves = true

; Size of the minimap, 1.0 is the default. From 0.5 to 2.5.
size = 1.0

; Distance from the top right corner of the screen, in pixels at 1080p.
margin = 24

; Keys: F1-F12, A-Z, 0-9, Insert, Delete, Home, End, PageUp, PageDown, Keypad0-Keypad9,
; or none to turn the key off.
toggle_key = F7
zoom_key = F8

; Experimental: local navigation layout from dungeons/maps.tsv and matching .nav files.
; Without a catalog, tombsward.nav enables the earlier Tombsward-only pilot.
; Other locations continue to use the normal map. Generate data before enabling this.
dungeon_mode = false
; Use local height-aware outdoor layouts when generated outdoor/ data is present.
outdoor_layers = true

; Parchment paper, sepia ink edges and 4 m slope contours on generated layouts.
; false restores the earlier flat geometry style. Normal world-map art is unchanged.
parchment_maps = true

; Metres above and below the current floor to highlight in gold.
; Default layered view also shows faint upper/lower context within 8 m.
dungeon_height_band = 2.0

; Cycle layered / current level only / all levels.
dungeon_floor_key = F11
