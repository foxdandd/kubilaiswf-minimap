[package]
name = "kubilaiswf-minimap"
version = "0.1.0"
edition = "2024"
publish = false
license = "MIT"

[lib]
crate-type = ["cdylib"]

# The crates.io release of `eldenring` only knows game version 2.6.2; this revision supports 2.7.1.
[dependencies]
eldenring = { git = "https://github.com/vswarte/fromsoftware-rs", rev = "59fbd3b3b7daaf14aca47c9f73530493dba6bc79" }
fromsoftware-shared = { git = "https://github.com/vswarte/fromsoftware-rs", rev = "59fbd3b3b7daaf14aca47c9f73530493dba6bc79" }
hudhook = { version = "0.9.3", default-features = false, features = ["dx12"] }
aes = "0.8"
rsa = { version = "0.9", features = ["pem"] }
libloading = "0.8"
texture2ddecoder = "0.1"
png = "0.17"
pelite = "0.10"

[profile.release]
lto = true
codegen-units = 1
panic = "abort"
strip = true
